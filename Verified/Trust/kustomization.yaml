# Trusted Key Store (AN1, AN2b)
# Genau eine ConfigMap "trusted-key-store" im Namespace "trust" mit fünf Einträgen:
# allowed_signers_producer (Producer, AN1), allowed_signers_authorizer (Authorizer, AN2b),
# build_platform.pub (öffentlicher Schlüssel der Build-Plattform, AN4),
# build_definition (Referenzliste der Build-Definition, AN4) und
# malicious_packages (Stand und Digest des Index der Meldeliste, AN5b).
# Die Prüfer (Gitea, Tekton, später Kyverno) lesen die ConfigMap über die
# Kubernetes-API. Wer lesen darf, legt trust.yaml fest.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- trust.yaml

configMapGenerator:
- name: trusted-key-store
  namespace: trust
  files:
  - allowed_signers_producer
  - allowed_signers_authorizer
  - build_platform.pub
  - build_definition
  - malicious_packages

generatorOptions:
  # fester Name, damit alle Prüfer immer auf "trusted-key-store" verweisen können
  disableNameSuffixHash: true
