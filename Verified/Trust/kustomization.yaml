# Trusted Key Store (AN1)
# Genau eine ConfigMap "trusted-key-store" im Namespace "trust".
# Quelle ist allowed_signers_producer. Der Schlüssel steht nur dort.
# Die Prüfer (Gitea, Tekton, später Kyverno) lesen die ConfigMap über die
# Kubernetes-API. Wer lesen darf, legt trust.yaml fest.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- trust.yaml

configMapGenerator:
- name: trusted-key-store
  namespace: trust
  files:
  - allowed_signers_producer

generatorOptions:
  # fester Name, damit alle Prüfer immer auf "trusted-key-store" verweisen können
  disableNameSuffixHash: true
