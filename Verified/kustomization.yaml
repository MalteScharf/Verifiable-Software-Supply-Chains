# Verifizierbare Lieferkette: Grundlage sind die unveränderten Manifeste der
# konventionellen Lieferkette aus ../Conventional. Alle Änderungen der
# verifizierbaren Kette werden hier als Patches oder zusätzliche Ressourcen
# ergänzt, sodass die Unterschiede zur Baseline an einer Stelle sichtbar sind.
#
# Anwenden (siehe Makefile, Target verified-base):
#   kubectl kustomize --load-restrictor=LoadRestrictionsNone Verified \
#     | kubectl --context kind-software-supply-chain-verified apply -f -
# Der Load-Restrictor ist nötig, weil die Manifeste außerhalb von Verified/ liegen.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
# VCS
- ../Conventional/Build/VCS/vcs.yaml
# Build
- ../Conventional/Build/tasks/git-clone.yaml
- ../Conventional/Build/tasks/kaniko.yaml
- ../Conventional/Build/pipeline.yaml
# Distribute
- ../Conventional/Distribute/registry.yaml
- ../Conventional/Distribute/npm-index.yaml
- ../Conventional/Distribute/pipeline.yaml
# Deploy
- ../Conventional/Deploy/tasks/run-deploy.yaml
- ../Conventional/Deploy/pipeline.yaml
- ../Conventional/Deploy/deploy.yaml
# Trusted Key Store (AN1), siehe Trust/kustomization.yaml
- Trust
# Prüfung der Signaturen in der Build-Plattform (AN1)
- Build/tasks/verify-signatures.yaml
# Prüfung der Quellreferenz in der Build-Plattform (AN2a)
- Build/tasks/verify-revision.yaml
# Prüfung der Autorisierung in der Build-Plattform (AN2b)
- Build/tasks/verify-authorization.yaml
# Prüfung der Abhängigkeitsdefinition in der Build-Plattform (AN3)
- Build/tasks/verify-dependencies.yaml
# Stückliste des fertigen Images (AN5)
- Build/tasks/sbom.yaml

patches:
# Gitea ist in diesem Cluster über Port 3001 erreichbar (siehe cluster-config.yaml)
- path: VCS/root-url.yaml
# Pre-receive-Hook (AN1) in den Gitea-Pod einbinden
- path: VCS/hook-mount.yaml
# Prüfung der Signaturen in die Distribute-Pipeline einfügen
- path: Build/pipeline-patch.yaml
  target:
    kind: Pipeline
    name: distribute
# Build-Definition über den Cluster-Resolver laden (AN4), nach pipeline-patch.yaml
- path: Build/pipeline-resolver-patch.yaml
  target:
    kind: Pipeline
    name: distribute
# Stückliste nach dem Build erzeugen (AN5), nach pipeline-resolver-patch.yaml
- path: Build/pipeline-sbom-patch.yaml
  target:
    kind: Pipeline
    name: distribute

# Deploy über den Digest (AN6): Task setzt das Image, Deployment nennt den Digest
- path: Deploy/deploy-task-patch.yaml
  target:
    kind: Task
    name: kubectl-deploy
- path: Deploy/deployment-patch.yaml
  target:
    kind: Deployment
    name: demo-app

# Pre-receive-Hook als ConfigMap im Namespace gitea
configMapGenerator:
- name: vcs-hooks
  namespace: gitea
  files:
  - VCS/verify-signatures.sh
  options:
    disableNameSuffixHash: true
