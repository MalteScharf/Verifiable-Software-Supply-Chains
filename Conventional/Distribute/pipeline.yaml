# Distribute-Pipeline (Baseline):
# Clont die Demo-App aus Gitea, baut das Image mit Kaniko und pusht es
# unter dem mutablen Tag "latest" in die clusterinterne OCI-Registry.
apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: distribute
spec:
  description: |
    Clont die Demo-App, baut das Image und pusht es in die clusterinterne OCI-Registry.
  params:
  - name: repo-url
    type: string
  - name: image
    type: string
    default: registry.registry.svc.cluster.local:5000/demo-app:latest
  workspaces:
  - name: shared-data
  tasks:
  - name: fetch-source
    taskRef:
      name: git-clone
    workspaces:
    - name: output
      workspace: shared-data
    params:
    - name: url
      value: $(params.repo-url)
  - name: build-and-push
    runAfter: ["fetch-source"]
    taskRef:
      name: kaniko
    workspaces:
    - name: source
      workspace: shared-data
    params:
    - name: IMAGE
      value: $(params.image)
    - name: BUILDER_IMAGE # Kaniko-Executor per Digest gepinnt, damit der Build-Werkzeug-Stand reproduzierbar ist
      value: gcr.io/kaniko-project/executor:v1.23.2@sha256:9e69fd4330ec887829c780f5126dd80edc663df6def362cd22e79bcdf00ac53f
    - name: EXTRA_ARGS
      value:
      - --insecure # Push ohne TLS, da die Registry unverschlüsselt betrieben wird (bewusste Baseline-Schwäche)
