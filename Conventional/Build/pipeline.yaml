# Build-Pipeline (Baseline):
# Clont die Demo-App aus dem clusterinternen Gitea und baut das Image mit Kaniko.
# Kein Publish: Das Image wird nur als tar im Workspace abgelegt (--no-push).
apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: build
spec:
  description: | 
    Clont die Demo-App und baut das Image. 
  params:
  - name: repo-url
    type: string
  - name: image
    type: string
    default: demo-app:latest
  workspaces:
  - name: shared-data
  tasks:
  - name: fetch-source
    taskRef:
      name: git-clone
    workspaces:
    - name: output
      workspace: shared-data
    params:
    - name: url
      value: $(params.repo-url)
  - name: build-origin
    runAfter: ["fetch-source"]
    taskRef:
      name: kaniko
    workspaces:
    - name: source
      workspace: shared-data
    params:
    - name: IMAGE
      value: $(params.image)
    - name: BUILDER_IMAGE # Kaniko-Executor per Digest gepinnt, damit der Build-Werkzeug-Stand reproduzierbar ist
      value: gcr.io/kaniko-project/executor:v1.23.2@sha256:9e69fd4330ec887829c780f5126dd80edc663df6def362cd22e79bcdf00ac53f
    - name: EXTRA_ARGS # zusätzliche Argumente für Kaniko,
      value: 
      - --no-push # Build-Phase endet vor dem Publish
      - --tar-path=/workspace/source/image.tar # Image wird nur lokal als tar abgelegt