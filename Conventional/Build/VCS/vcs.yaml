# Konfiguration des VCS
# Erstellt die Gitea-Instanz im Cluster, die als VCS für die Demo-App dient.
apiVersion: v1
kind: Namespace
metadata:
  name: gitea
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-data
  namespace: gitea
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: gitea
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitea
  template:
    metadata:
      labels:
        app: gitea
    spec:
      containers:
      - name: gitea
        image: gitea/gitea:1.27.1
        ports:
        - containerPort: 3000
        env:                               # spezielle Gitea-Konfiguration, siehe https://docs.gitea.com/administration/config-cheat-sheet/
        - name: GITEA__database__DB_TYPE
          value: sqlite3
        - name: GITEA__server__HTTP_PORT # Port, auf dem Gitea im Container lauscht
          value: "3000"
        - name: GITEA__server__ROOT_URL # URL, unter der Gitea erreichbar ist (für die Demo-App: localhost:3000)
          value: http://localhost:3000/
        - name: GITEA__security__INSTALL_LOCK # verhindert, dass Gitea beim Starten die Installation erneut ausführt
          value: "true"
        volumeMounts:
        - name: gitea-data
          mountPath: /data
      volumes:
      - name: gitea-data
        persistentVolumeClaim:
          claimName: gitea-data
---
apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: gitea
spec:
  type: NodePort
  selector:
    app: gitea
  ports:
    - port: 3000 # Port, auf dem der Service lauscht
      targetPort: 3000 # Port, auf den der Service weiterleitet (Container-Port)
      nodePort: 30300 # Port, unter dem der Service von außen erreichbar ist 

